<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Безсайта</title>
<meta name="description" content="Находит бизнесы без сайта в любом городе и делает каждому живой черновик сайта, который можно отправить ссылкой.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontsTool" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ================= TOOL ================= */
/* Layout: workbench. Left rail = search, filters, lead list. Right = map, then the selected lead's pitch (phone preview + message). */
:root{
  --bg:#ECEFEA; --panel:#F9FBF7; --sunk:#E3E8E1; --ink:#141D18; --muted:#5B6860; --line:#D0D8CD;
  --accent:#EF5320; --accent-ink:#FFFFFF; --warm:#2B7552; --cold:#8C978F; --hilite:#FFE6DA;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1411; --panel:#161D19; --sunk:#1D2620; --ink:#E4EBE6; --muted:#94A098; --line:#28332C;
  --accent:#FF6C3B; --accent-ink:#1B0D06; --warm:#5BC291; --cold:#727E76; --hilite:#3A2015; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body.tool{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.tool a{color:inherit}
body.tool button,body.tool input,body.tool select,body.tool textarea{font:inherit;color:inherit}
body.tool :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.appbar-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:2px}
.logo s{text-decoration-color:var(--accent);text-decoration-thickness:3px;color:var(--muted)}
.stats{display:flex;gap:18px;margin-left:auto;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.stat b{font-family:var(--f-display);font-weight:500;font-size:17px;color:var(--ink)}
.stat.hot b{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-decoration:none;font-weight:500;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:16px;height:16px;flex:none}

.shell{max-width:1440px;margin:0 auto;padding-inline:20px;padding-block:18px 60px;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:18px;align-items:start}
.rail{display:grid;gap:14px;position:sticky;top:76px;max-height:calc(100vh - 92px);grid-template-rows:auto minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.search{padding:16px;display:grid;gap:12px}
.search h1{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.25;margin:0;text-wrap:balance}
.search h1 em{font-style:normal;color:var(--accent)}
.cityrow{display:flex;gap:8px}
.cityrow input{flex:1;min-width:0}
input[type=text],input[type=tel],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
.niches{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;user-select:none;background:var(--panel)}
.chip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.progress{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:20px}
.progress.err{color:var(--accent)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

.leads{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.lhead{padding:12px 12px 10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.lrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.lrow select{width:auto;padding:6px 8px;font-size:13px;margin-left:auto}
.list{list-style:none;margin:0;padding:6px;overflow:auto;min-height:120px}
.lead{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:1px 10px;padding:9px 10px;border-radius:8px;cursor:pointer;align-items:center}
.lead:hover{background:var(--sunk)}
.lead[aria-selected=true]{background:var(--hilite)}
.dot{width:10px;height:10px;border-radius:50%;grid-row:span 2}
.dot.hot{background:var(--accent)} .dot.warm{background:var(--warm)} .dot.cold{border:2px solid var(--cold)}
.lead .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead .sub{grid-column:2;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;border-radius:5px;padding:1px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;grid-row:span 2}
.pill.sent{border-color:var(--ink);color:var(--ink)} .pill.replied{background:var(--warm);border-color:var(--warm);color:var(--panel)} .pill.client{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .pill.no{text-decoration:line-through}
.more{padding:10px;text-align:center;font-size:13px;color:var(--muted)}

.main{display:grid;gap:18px;min-width:0}
.mapcard{overflow:hidden;position:relative}
#map{height:300px;background:var(--sunk)}
.maplegend{position:absolute;left:12px;bottom:12px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:12px}
.maplegend span{display:inline-flex;align-items:center;gap:5px}
.leaflet-container{font-family:var(--f-body)}

.welcome{padding:28px;display:grid;gap:22px}
.welcome h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,36px);line-height:1.1;margin:0;max-width:20ch;text-wrap:balance}
.welcome h2 em{font-style:normal;color:var(--accent)}
.welcome p{margin:0;color:var(--muted);max-width:60ch}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:s}
.steps div{border-top:2px solid var(--ink);padding-top:10px;font-size:14px}
.steps b{display:block;font-family:var(--f-display);font-weight:500;font-size:14px;margin-bottom:4px}

.pitch{padding:20px;display:grid;gap:18px}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px 20px}
.phead h2{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13.5px;margin-top:6px}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.why span{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 8px}
.why span.ok{border-color:var(--warm);color:var(--warm)}
.statusbar{display:flex;flex-wrap:wrap;gap:4px}
.statusbar button{font-size:12.5px;padding:5px 9px}
.statusbar button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.contacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.contacts .c{font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.contacts svg{width:15px;height:15px;flex:none}
.contacts code{font-family:var(--f-mono);font-size:12.5px}
.contacts a.c:hover{border-color:var(--ink)}
.verify{font-size:13px;color:var(--muted)}
.sitebox{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.sitebox.found{border-style:solid;border-color:var(--accent);background:var(--hilite)}
.sitebox a{color:var(--accent);font-weight:600}
.pill.site{background:var(--sunk);color:var(--muted)}
.verify a{color:var(--accent);font-weight:500}

.grid2{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
.phone{width:100%;max-width:340px;aspect-ratio:9/18.5;border-radius:34px;background:#0B0B0C;padding:10px;box-shadow:0 30px 60px -30px rgba(0,0,0,.55);position:relative;margin:0 auto}
.phone::before{content:"";position:absolute;top:3px;left:50%;transform:translateX(-50%);width:64px;height:4px;border-radius:4px;background:#2A2A2C;z-index:2}
.phone iframe{width:100%;height:100%;border:0;border-radius:26px;background:#fff;display:block}
.under{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.styles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.styles button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.blockh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 8px}
.msgcol{display:grid;gap:12px;min-width:0}
.tabs{display:flex;gap:4px}
.tabs button{font-size:12.5px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
textarea.msg{min-height:250px;resize:vertical;line-height:1.55;font-size:14px}
.send{display:flex;flex-wrap:wrap;gap:8px}
.linkbox{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:8px;padding:6px 6px 6px 10px}
.linkbox span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.nudge{font-size:13px;background:var(--hilite);border-radius:8px;padding:8px 12px}
.nudge button{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,14,12,.45)}
.dlg{padding:22px;display:grid;gap:14px}
.dlg h3{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0}
.dlg p{margin:0;color:var(--muted);font-size:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
.field.full{grid-column:1/-1}
.dlgfoot{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:1000;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}

@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.rail{position:static;max-height:none}.list{max-height:380px}#map{height:240px}.steps{grid-template-columns:minmax(0,1fr)}.stats{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

</style>
</head>
<body class="tool">
<noscript>Для работы нужен JavaScript.</noscript>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   SHARED DATA
   ============================================================ */
const ICONS={
  beauty:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/>',
  food:'<path d="M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2M10 2v2M14 2v2"/>',
  auto:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',

  wa:'<path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/>',
  tg:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>'

const ico=(n,cls)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'+(cls?' class="'+cls+'"':'')+'>'+(ICONS[n]||ICONS.other)+'</svg>';

const NICHES=[
  {id:"beauty",ru:"Красота",shop:["hairdresser","beauty","massage","cosmetics","tattoo"],amenity:[]},
  {id:"food",ru:"Кафе и еда",shop:["bakery","pastry","confectionery","coffee","deli"],amenity:["cafe","restaurant","fast_food"]},
  {id:"auto",ru:"Авто",shop:["car_repair","tyres","car_parts"],amenity:["car_wash"]},
  {id:"health",ru:"Здоровье",shop:["optician","hearing_aids","medical_supply"],amenity:["dentist","doctors","clinic","veterinary"]},

  {id:"shop",ru:"Магазины",shop:["florist","gift","clothes","pet","books","jewelry","toys","furniture"],amenity:[]}
];
const KIND={hairdresser:"Парикмахерская",beauty:"Салон красоты",massage:"Массаж",cosmetics:"Косметика",tattoo:"Тату-студия",bakery:"Пекарня",pastry:"Кондитерская",confectionery:"Кондитерская",coffee:"Кофе",deli:"Деликатесы",cafe:"Кафе",restaurant:"Ресторан",fast_food:"Фастфуд",car_repair:"Автосервис",tyres:"Шиномонтаж",car_parts:"Автозапчасти",car_wash:"Автомойка",optician:"Оптика",hearing_aids:"Слуховые аппараты",medical_supply:"Медтехника",dentist:"Стоматология",doctors:"Врач",clinic:"Клиника",veterinary:"Ветклиника",tailor:"Ателье",shoe_repair:"Ремонт обуви",locksmith:"Ключи и замки",sewing:"Швейная",repair:"Ремонт",electronics_repair:"Ремонт техники",florist:"Цветы",gift:"Подарки",clothes:"Одежда",pet:"Зоотовары",books:"Книги",jewelry:"Ювелирный",toys:"Игрушки",furniture:"Мебель"};
const KIND_EN={hairdresser:"Hair salon",beauty:"Beauty salon",massage:"Massage",cosmetics:"Cosmetics",tattoo:"Tattoo studio",bakery:"Bakery",pastry:"Pastry shop",confectionery:"Confectionery",coffee:"Coffee",deli:"Deli",cafe:"Café",restaurant:"Restaurant",fast_food:"Takeaway",car_repair:"Car service",tyres:"Tyre service",car_parts:"Car parts",car_wash:"Car wash",optician:"Optician",hearing_aids:"Hearing aids",medical_supply:"Medical supplies",dentist:"Dental clinic",doctors:"Doctor",clinic:"Clinic",veterinary:"Vet clinic",tailor:"Tailor",shoe_repair:"Shoe repair",locksmith:"Locksmith",sewing:"Sewing",repair:"Repairs",electronics_repair:"Electronics repair",florist:"Florist",gift:"Gift shop",clothes:"Clothing",pet:"Pet shop",books:"Bookshop",jewelry:"Jeweller",toys:"Toy shop",furniture:"Furniture"};

function nicheOf(t){
  for(const n of NICHES){if((t.shop&&n.shop.includes(t.shop))||(t.amenity&&n.amenity.includes(t.amenity)))return n.id}
  if(t.craft)return"craft";if(t.shop)return"shop";return"other";
}
function tagKey(t){return t.shop||t.amenity||(t.craft?"craft":"")}

/* palettes: light bg, ink, accent, dark bg, bright accent, card light */
const PAL={
  beauty:["#FBF1EE","#3A2230","#B8325E","#1A1115","#FF7AA2"],
  food:["#FFF5E6","#2E2116","#C2611A","#17110B","#FFA552"],
  auto:["#EEF2F6","#111A24","#1E5BCB","#0C1016","#5B97FF"],
  health:["#EEF7F5","#0F2E2B","#0F7A6A","#0A1615","#44D6BE"],
  craft:["#F6F1E9","#272219","#8A5A1F","#15120D","#E0AA62"],

/* opening_hours → rows */
const DAYS_RU={Mo:"Пн",Tu:"Вт",We:"Ср",Th:"Чт",Fr:"Пт",Sa:"Сб",Su:"Вс",PH:"Праздники"};
const DAYS_EN={Mo:"Mon",Tu:"Tue",We:"Wed",Th:"Thu",Fr:"Fri",Sa:"Sat",Su:"Sun",PH:"Holidays"};
function hoursRows(h,lang){
  if(!h)return[];const D=lang==="en"?DAYS_EN:DAYS_RU;
  if(h.trim()==="24/7")return[[lang==="en"?"Every day":"Ежедневно",lang==="en"?"24 hours":"Круглосуточно"]];
  return h.split(";").map(p=>p.trim()).filter(Boolean).slice(0,7).map(p=>{
    const m=p.match(/^([A-Za-z,\- ]+?)\s+(.+)$/);
    const days=m?m[1]:"",time=m?m[2]:p;
    const dd=days.replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH)\b/g,x=>D[x]).replace(/-/g,"–").replace(/,/g,", ");
    const tt=time.replace(/\boff\b/i,lang==="en"?"closed":"выходной").replace(/-/g,"–");
    return[dd||(lang==="en"?"Hours":"Часы"),tt];
  });
}
function hoursLine(h,lang){return hoursRows(h,lang).map(r=>r[0]+" "+r[1]).join(" · ")}

/* compact link payload: JSON → deflate-raw → base64url */
function b64u(bytes){let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(str){const s=atob(str.replace(/-/g,"+").replace(/_/g,"/"));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function packData(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream!=="undefined"){
    try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return"z"+b64u(buf)}catch(e){}
  }
  return"j"+b64u(raw);
}
async function unpackData(str){
  const kind=str[0],bytes=unb64u(str.slice(1));
  if(kind==="z"){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return JSON.parse(await new Response(ds).text())}
  return JSON.parse(new TextDecoder().decode(bytes));
}

function digits(p){let d=String(p||"").split(/[;,]/)[0].replace(/[^\d+]/g,"");if(d.startsWith("00"))d="+"+d.slice(2);return d.replace(/\+/g,"")}
function telHref(p){const d=String(p||"").split(/[;,]/)[0].replace(/[^\d+]/g,"");return"tel:"+d}

/* opening_hours → week[0..6] (Mon..Sun) of [fromMin,toMin][] ; null if unknown */
function parseWeek(h){
  if(!h)return null;const s=h.trim();const all=()=>Array.from({length:7},()=>[[0,1440]]);
  if(s==="24/7")return all();
  const C=["Mo","Tu","We","Th","Fr","Sa","Su"];const wk=Array.from({length:7},()=>null);let ok=false;
  for(const part of s.split(";").map(x=>x.trim()).filter(Boolean)){
    const m=part.match(/^((?:Mo|Tu|We|Th|Fr|Sa|Su)(?:\s*[-,]\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))*)?\s*(.*)$/);if(!m)continue;
    let days=[];
    if(m[1]){for(const seg of m[1].split(",")){const r=seg.split("-").map(x=>C.indexOf(x.trim()));if(r.length===2&&r[0]>=0&&r[1]>=0){let i=r[0];for(let k=0;k<7;k++){days.push(i);if(i===r[1])break;i=(i+1)%7}}else if(r[0]>=0)days.push(r[0])}}
    else days=[0,1,2,3,4,5,6];
    const rest=m[2].trim();
    if(/^off|closed/i.test(rest)){days.forEach(d=>wk[d]=[]);ok=true;continue}
    const ranges=[...rest.matchAll(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/g)].map(x=>[+x[1]*60+ +x[2],(+x[3]*60+ +x[4])||1440]);
    if(ranges.length){days.forEach(d=>wk[d]=ranges);ok=true}
  }
  if(!ok)return null;return wk.map(x=>x||[]);

.citem button{position:absolute;right:12px;bottom:12px;border:0;border-radius:var(--br);background:var(--bg);color:var(--ink);font:600 14px "Onest",system-ui,sans-serif;padding:10px 16px;cursor:pointer;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.map{border-radius:var(--rc);overflow:hidden;min-height:420px;position:relative;background:var(--soft)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:var(--mf,grayscale(.3))}
.hrs{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;font-variant-numeric:tabular-nums}
.hrs .today{color:var(--acc);font-weight:700}
.bigtel{font-family:var(--fd);font-weight:var(--fw);font-size:clamp(28px,3.6vw,52px);letter-spacing:calc(var(--ls)*.6);text-decoration:none;line-height:1;display:inline-block}
.brand-g{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.brand-g>div{border-radius:var(--rc);min-height:200px;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.bt1{grid-column:span 3;background:var(--soft)}.bt2{grid-column:span 3;background:var(--ink)}.bt3{grid-column:span 2;background:var(--acc)}
.bt2 .logo{color:var(--bg)}.bt3 .logo{color:var(--on)}
.bt2 .logo .wm small{color:color-mix(in srgb,var(--bg) 60%,transparent)}.bt3 .logo .wm small{color:color-mix(in srgb,var(--on) 70%,transparent)}
.brand-g .logo .wm b{font-size:30px}
.sw{grid-column:span 2;display:grid!important;grid-template-columns:repeat(4,1fr);gap:0;padding:0!important;place-items:stretch!important}
.sw span{display:flex;align-items:flex-end;padding:12px;font:500 11px ui-monospace,Menlo,monospace}
.typ{grid-column:span 2;background:var(--soft);place-items:start!important;align-content:space-between}
.typ .aa{font-family:var(--fd);font-weight:var(--fw);font-size:96px;line-height:.9;letter-spacing:var(--ls)}
.brand-g .cap{position:absolute;left:18px;top:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.6}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock .btn3{flex:1;padding:14px 10px;font-size:15px}
@media(min-width:900px){.dock{display:none}body.site{padding-bottom:0}}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:20px;animation:fade .25s}
.modal>div{background:var(--bg);color:var(--ink);border-radius:var(--rc);padding:32px;max-width:440px;display:grid;gap:14px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);animation:pop .4s cubic-bezier(.2,.8,.2,1)}
.modal b{font-family:var(--fd);font-weight:var(--fw);font-size:30px;line-height:1.05;letter-spacing:calc(var(--ls)*.6)}
.modal p{margin:0;color:var(--mute)}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(20px) scale(.96);opacity:0}}
.loader{position:fixed;inset:0;z-index:100;background:var(--ink);color:var(--bg);display:grid;place-items:center;transition:transform .8s cubic-bezier(.7,0,.2,1)}
.loader.out{transform:translateY(-100%)}
.loader .logo{transform:scale(1.6)}
.loader .logo .wm{overflow:hidden}.loader .logo .wm b{display:block;animation:up .8s .25s cubic-bezier(.2,.8,.2,1) both}
.loader .logo .wm small{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.loader .draw{stroke-dasharray:160;stroke-dashoffset:160;animation:draw 1s cubic-bezier(.6,0,.2,1) forwards}
.loader .fillin{transform-origin:center;transform-box:fill-box;animation:grow .5s .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes grow{from{transform:scale(0)}}@keyframes up{from{transform:translateY(110%)}}
.anim .rv{opacity:0;transform:translateY(46px);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0) * 90ms)}
.anim .rv.in{opacity:1;transform:none}
.wd{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.wd>span{display:inline-block}
.anim .split .wd>span{transform:translateY(105%);transition:transform 1.1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i) * 70ms + 150ms)}
.anim .split.in .wd>span{transform:none}
.anim .clip{clip-path:inset(18% 8% 18% 8%);transition:clip-path 1.4s cubic-bezier(.7,0,.2,1)}
.anim .clip.in{clip-path:inset(0 0 0 0)}
.anim .clip img{transform:scale(1.25);transition:transform 1.8s cubic-bezier(.2,.8,.2,1)}
.anim .clip.in img{transform:scale(1)}
.hoverimg{position:fixed;width:260px;height:320px;border-radius:var(--rc);pointer-events:none;z-index:25;opacity:0;transform:translate(-50%,-50%) scale(.85) rotate(-4deg);transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1);overflow:hidden;background:var(--soft)}
.hoverimg.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}
.hoverimg img{width:100%;height:100%;object-fit:cover;filter:var(--pf,none)}

/* ================= THEME: JOURNAL ================= */
.th-journal .hA{padding-top:clamp(20px,4vw,48px)}
.th-journal .meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--line)}
.th-journal .meta div{padding:14px 16px 14px 0;font-size:14px;display:grid;gap:3px;min-width:0}
.th-journal .meta div+div{padding-left:16px;border-left:1px solid var(--line)}
.th-journal .hA .fit{margin:clamp(18px,3vw,34px) 0 clamp(10px,2vw,20px)}
.th-journal .hA .row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(20px,4vw,60px);align-items:end;margin-bottom:clamp(24px,4vw,40px)}
.th-journal .hA h1{font-size:clamp(26px,3.3vw,46px);line-height:1.08}
.th-journal .hA p{margin:0 0 22px;color:var(--mute);font-size:17px;max-width:44ch}
.th-journal .hA .big{height:clamp(320px,62vh,680px);border-radius:var(--rc)}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,.8fr) auto;gap:16px;align-items:center;padding:clamp(18px,2.4vw,28px) 0;border-bottom:1px solid var(--line);transition:padding .35s cubic-bezier(.2,.8,.2,1)}
.prow .i{font-family:var(--fd);color:var(--mute);font-size:14px}
.prow b{font-family:var(--fd);font-weight:var(--fw);font-size:clamp(22px,2.6vw,36px);letter-spacing:calc(var(--ls)*.6);line-height:1.05}
.up .prow b{text-transform:uppercase}
.prow small{color:var(--mute);font-size:15px}
.prow em{font-style:normal;font-weight:600;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media(hover:hover){.prow:hover{padding-left:18px}.prow:hover b{color:var(--acc)}}
.stack .scard{position:sticky;top:90px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:var(--rc);overflow:hidden;background:var(--soft);min-height:400px;margin-bottom:24px;box-shadow:0 -20px 50px -30px rgba(0,0,0,.35)}
.stack .scard:nth-child(2){top:110px;background:var(--ink);color:var(--bg)}.stack .scard:nth-child(3){top:130px;background:var(--acc);color:var(--on)}
.scard .t{padding:clamp(24px,4vw,52px);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.scard h3{font-family:var(--fd);font-weight:var(--fw);font-size:clamp(28px,3.6vw,54px);letter-spacing:var(--ls);line-height:1.02;margin:0}
.up .scard h3{text-transform:uppercase}
.scard .big{font-family:var(--fd);font-weight:var(--fw);font-size:clamp(40px,5vw,72px);color:var(--acc);letter-spacing:-.04em;line-height:1}
.stack .scard:nth-child(3) .big{color:var(--on)}
.gal-h{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:none;cursor:grab}
.gal-h::-webkit-scrollbar{display:none}
.gal-h .ph{flex:0 0 clamp(240px,32vw,440px);height:clamp(300px,40vw,540px);border-radius:var(--rc);scroll-snap-align:start}
.gal-h .ph:nth-child(even){margin-top:50px}
.ct-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px}
.ct-split .info{background:var(--soft);border-radius:var(--rc);padding:clamp(22px,3vw,40px);display:grid;gap:26px;align-content:start}
.ffoot{padding-top:clamp(40px,6vw,80px);overflow:hidden}
.ffoot .fit{color:var(--acc);margin:0 0 -.12em}
.ffoot .bar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute);padding-block:22px;border-top:1px solid var(--line)}

/* ================= THEME: BENTO ================= */
.th-bento .hB{padding-top:12px;padding-bottom:clamp(24px,4vw,48px)}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:minmax(120px,auto);gap:12px}
.bento>*{border-radius:var(--rc);overflow:hidden;position:relative}
.bx-h{grid-column:span 7;grid-row:span 3;background:var(--acc);color:var(--on);padding:clamp(24px,3.4vw,46px);display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.bx-h h1{font-size:clamp(40px,5.6vw,84px)}
.bx-h p{margin:0;font-size:17px;max-width:40ch;opacity:.85}
.bx-h .btn3.i{background:var(--on);color:var(--acc)}
.bx-p{grid-column:span 5;grid-row:span 4}
.bx-r{grid-column:span 3;background:var(--soft);padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.bx-r .num,.tile .num{font-family:var(--fd);font-weight:var(--fw);font-size:54px;line-height:1;letter-spacing:-.04em}
.stars{color:var(--acc);letter-spacing:2px;font-size:15px}
.bx-s{grid-column:span 4;background:var(--ink);color:var(--bg);padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(170px,auto);gap:12px}
.tile{background:var(--soft);border-radius:var(--rc);padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tile:hover{transform:translateY(-4px)}
.tile b{font-family:var(--fd);font-weight:var(--fw);font-size:24px;line-height:1.05;letter-spacing:calc(var(--ls)*.5)}
.tile em{font-style:normal;font-weight:700;align-self:flex-start;background:var(--bg);border-radius:999px;padding:5px 12px;font-size:15px}
.tile.big{grid-column:span 2;grid-row:span 2;color:#fff;padding:0}
.tile.big .ph{position:absolute;inset:0}
.tile.big .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.7))}
.tile.big .tx{position:relative;margin-top:auto;padding:26px;display:grid;gap:10px}
.tile.big b{font-size:clamp(28px,3vw,42px)}
.tile.acc{background:var(--acc);color:var(--on)}.tile.ink{background:var(--ink);color:var(--bg)}.tile.ink em{background:var(--acc);color:var(--on)}
.masonry{columns:3 260px;column-gap:12px}
.masonry .ph{border-radius:var(--rc);margin-bottom:12px;break-inside:avoid}
.masonry .ph:nth-child(3n+1){aspect-ratio:3/4}.masonry .ph:nth-child(3n+2){aspect-ratio:1}.masonry .ph:nth-child(3n){aspect-ratio:4/5}

/* ================= THEME: BRUTAL ================= */
.th-brutal{--br:0px;--rc:0px}
.th-brutal .w{max-width:1440px}
.th-brutal .hdr .w{border-bottom:2px solid var(--line)}
.th-brutal .hdr.sc{box-shadow:none}
.bru-hero{border-bottom:2px solid var(--line)}
.bru-hero .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-inline:2px solid var(--line)}
.bru-hero .grid>div{padding:clamp(18px,3vw,36px)}
.bru-hero .grid>div+div{border-left:2px solid var(--line)}
.bru-hero .fit{margin:0;line-height:.8;padding-top:.06em}
.bru-hero h1{font-size:clamp(30px,3.6vw,52px);line-height:1}
.bru-hero .fig{border:2px solid var(--line);height:clamp(260px,40vw,520px);position:relative}
.bru-hero .fig figcaption,.cap2{position:absolute;left:0;bottom:0;background:var(--acc);color:var(--on);font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:6px 10px;text-transform:uppercase}
.bru-hero .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--line);border-inline:2px solid var(--line)}
.bru-hero .facts div{padding:16px clamp(18px,3vw,36px);font:600 14px ui-monospace,Menlo,monospace;text-transform:uppercase}
.bru-hero .facts div+div{border-left:2px solid var(--line)}
.th-brutal .mq{background:var(--acc);color:var(--on);border-block:2px solid var(--line)}
.th-brutal .mq span::after{background:var(--on);border-radius:0;transform:rotate(45deg)}
.bt-tab{width:100%;border-collapse:collapse;border:2px solid var(--line);font-size:16px}
.bt-tab th,.bt-tab td{border:2px solid var(--line);padding:16px 18px;text-align:left;vertical-align:top}
.bt-tab th{font:700 12px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:var(--bg)}
.bt-tab td:first-child{font-family:ui-monospace,Menlo,monospace;width:64px}
.bt-tab td b{font-family:var(--fd);font-weight:var(--fw);font-size:clamp(20px,2.4vw,30px);text-transform:uppercase;line-height:1}
.bt-tab td:last-child{white-space:nowrap;font-weight:700;font-size:18px;width:1%}
.bt-tab tr:hover td{background:var(--acc);color:var(--on)}
.th-brutal .shead{border-top:2px solid var(--line);padding-top:16px}
.th-brutal .shead .n{font-family:ui-monospace,Menlo,monospace}
.bcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid var(--line)}
.bcols>div{padding:clamp(20px,3vw,36px);display:grid;gap:18px;align-content:start}
.bcols>div+div{border-left:2px solid var(--line)}
.bcols .num{font-family:var(--fd);font-weight:var(--fw);font-size:clamp(56px,7vw,110px);line-height:.85;color:var(--acc);text-transform:uppercase}
.bcols h3{margin:0;font-family:var(--fd);font-weight:var(--fw);text-transform:uppercase;font-size:24px;line-height:1}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2px solid var(--line)}
.bgrid .ph{aspect-ratio:1;border-right:2px solid var(--line)}
.bgrid .ph:last-child{border-right:0}
.th-brutal .bk .pane,.th-brutal .mitem,.th-brutal .tile{border:2px solid var(--line);background:transparent}
.th-brutal .bk .sum{border:2px solid var(--line)}
.th-brutal .chips button{border-width:2px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;font-size:13px}
.bct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:2px solid var(--line)}
.bct>div{padding:clamp(20px,3vw,36px);display:grid;gap:22px;align-content:start}
.bct>.map{border-left:2px solid var(--line);border-radius:0;min-height:420px}
.th-brutal .brand-g>div{border:2px solid var(--line)}
.bfoot{background:var(--ink);color:var(--bg);overflow:hidden;margin-top:40px}
.bfoot .fit{color:var(--acc);margin:0;line-height:.8;padding-top:.1em}
.bfoot .bar{display:flex;justify-content:space-between;font:600 12px ui-monospace,Menlo,monospace;text-transform:uppercase;padding-block:16px;border-top:2px solid var(--bg);gap:12px;flex-wrap:wrap}

/* ================= THEME: ELEGANT ================= */
.th-elegant{--br:999px;--rc:4px}
.th-elegant .lbl{letter-spacing:.3em;font-size:11px}
.el-hero{text-align:center;padding-top:clamp(30px,6vw,80px)}
.el-hero .lbl{display:block;margin-bottom:22px}
.el-hero h1{font-size:clamp(48px,8.6vw,132px);max-width:13ch;margin:0 auto;font-style:italic}
.el-hero p{max-width:46ch;margin:26px auto 30px;color:var(--mute);font-size:18px}
.el-hero .ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.arches{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:clamp(12px,2vw,28px);align-items:end;margin-top:clamp(40px,6vw,80px)}
.arches .ph{border-radius:999px 999px 6px 6px;aspect-ratio:3/4}
.arches .ph:nth-child(2){aspect-ratio:3/4.2}
.el-head{text-align:center;margin-bottom:clamp(36px,5vw,64px)}
.el-head .orn{display:block;font-family:var(--fd);font-size:28px;color:var(--acc);margin-bottom:10px}
.el-head h2{font-size:clamp(40px,6vw,84px);font-style:italic}
.el-head p{color:var(--mute);margin:14px auto 0;max-width:46ch;font-size:17px}
.dots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px clamp(30px,5vw,80px);max-width:1000px;margin:0 auto}
.dots div{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:baseline;padding:16px 0}
.dots b{font-family:var(--fd);font-weight:var(--fw);font-size:clamp(22px,2.2vw,28px);line-height:1.1}
.dots i{border-bottom:1px dotted var(--mute);transform:translateY(-5px)}
.dots em{font-style:normal;font-family:var(--fd);font-size:22px;font-weight:var(--fw)}
.dots small{grid-column:1/-1;color:var(--mute);font-style:italic}
.rcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,4vw,60px);text-align:center}
.rcols .num{font-family:var(--fd);font-size:56px;color:var(--acc);font-style:italic;line-height:1}
.rcols h3{font-family:var(--fd);font-weight:var(--fw);font-size:30px;margin:12px 0 8px;line-height:1.1}
.rcols p{margin:0;color:var(--mute)}
.arch-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.arch-row .ph{border-radius:999px 999px 6px 6px;aspect-ratio:2/3}
.arch-row .ph:nth-child(even){transform:translateY(40px)}
.el-ct{text-align:center;display:grid;gap:22px;justify-items:center}
.el-ct .map{width:100%;min-height:360px;border-radius:200px 200px 6px 6px;margin-top:20px}
.th-elegant .bk .pane,.th-elegant .mitem{background:transparent;border:1px solid var(--line)}
.th-elegant .mitem b{font-style:italic}
.th-elegant .bk .sum{background:var(--acc);color:var(--on)}
.efoot{text-align:center;padding-block:60px 30px;border-top:1px solid var(--line);display:grid;gap:18px;justify-items:center;color:var(--mute);font-size:13px}

/* ================= THEME: CINEMA ================= */
.th-cinema{--pf:brightness(.88) contrast(1.05)}
.hC{position:relative;min-height:min(100svh,920px);color:#fff;overflow:hidden;margin-top:-72px;display:flex;align-items:flex-end;padding-top:120px}
.hC>.ph{position:absolute;inset:0;background:#111}
.hC>.ph img{transform:scale(1.15);animation:kb 18s ease-out forwards}
@keyframes kb{to{transform:scale(1)}}
.hC .shade{position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 100%,rgba(0,0,0,.8),rgba(0,0,0,.15) 60%),linear-gradient(180deg,rgba(0,0,0,.5),transparent 30%)}
.hC .hcin{position:relative;padding-bottom:clamp(28px,5vw,64px)}
.hC h1{font-size:clamp(46px,8.4vw,138px);max-width:12ch;margin-top:16px}
.hC .lbl{color:rgba(255,255,255,.75)}
.hC .row{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-top:26px}
.hC .row p{margin:0;max-width:44ch;font-size:17px;opacity:.85}
.hC .side{position:absolute;right:clamp(16px,3vw,32px);top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.7}
.cstack .scard{position:sticky;top:80px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);min-height:70vh;margin-bottom:20px;border-radius:var(--rc);overflow:hidden;background:var(--soft)}
.cstack .scard .ph{min-height:100%}
.cstack .scard:nth-child(even){grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.cstack .scard:nth-child(even) .ph{order:2}
.cstack .t .price{font-family:var(--fd);font-weight:var(--fw);font-size:clamp(34px,4vw,60px);color:var(--acc);line-height:1}
.fullq{position:relative;min-height:80vh;display:grid;align-items:center;color:#fff;overflow:hidden}
.fullq>.ph{position:absolute;inset:-10% 0}
.fullq>.ph::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}

/* Ask several public map servers, staggered; first good answer wins, the rest are cancelled. */
function overpass(q,onTry){
  const errs=[];const ctls=[];let done=false;
  return new Promise((resolve,reject)=>{
    let pending=OVERPASS.length;
    OVERPASS.forEach(([name,url],i)=>{
      setTimeout(async()=>{
        if(done)return;
        const ctl=new AbortController();ctls.push(ctl);const to=setTimeout(()=>ctl.abort(),95000);
        onTry&&onTry(name);
        try{
          const r=await fetch(url,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ctl.signal});
          if(!r.ok)throw new Error(String(r.status));
          const j=await r.json();
          if(j.remark&&/runtime error|timed out|out of memory/i.test(j.remark)&&!(j.elements||[]).length)throw new Error("timeout");
          if(!done){done=true;ctls.forEach(c=>c!==ctl&&c.abort());resolve(j)}
        }catch(e){
          if(!done)errs.push(name+": "+(e.name==="AbortError"?"нет ответа":e.message==="Failed to fetch"?"недоступен":e.message));
          if(--pending===0&&!done)reject(errs);
        }finally{clearTimeout(to)}
      },i*4000);
    });
  });
}

/* ---------- scoring ---------- */
function enrich(raw){
  const seen=new Set(),out=[];
  for(const r of raw){
    const t=r.tags||{};if(!t.name)continue;
    if(t.website||t["contact:website"]||t.url||t.brand||t["brand:wikidata"])continue;
    if(t.disused||t["disused:shop"]||t.abandoned)continue;
    const key=(t.name+"|"+(t["addr:street"]||"")).toLowerCase();if(seen.has(key))continue;seen.add(key);
    const phone=t.phone||t["contact:phone"]||t["contact:mobile"]||"",email=t.email||t["contact:email"]||"";
    const insta=t["contact:instagram"]||t.instagram||"",fb=t["contact:facebook"]||t.facebook||"",vk=t["contact:vk"]||t["contact:vkontakte"]||"",tgc=t["contact:telegram"]||"";
    const addr=[t["addr:street"]||t["addr:place"],t["addr:housenumber"]].filter(Boolean).join(" ");
    const why=[];let sc=0;
    if(phone){sc+=2;why.push("телефон")} if(insta||fb||vk||tgc){sc+=2;why.push("соцсети")} if(email){sc+=1;why.push("email")} if(t.opening_hours){sc+=1;why.push("часы")} if(addr){sc+=1;why.push("адрес")} if(t["dg:rating"]){const rv=+t["dg:reviews"]||0,rt=+t["dg:rating"]||0;if(rv>=5)sc+=1;if(rv>=20&&rt>=4.3)sc+=1;why.push("★ "+t["dg:rating"]+" ("+rv+")")}
    const tag=tagKey(t),niche=nicheOf(t);
    out.push({id:r.id,tags:t,lat:r.lat??null,lon:r.lon??null,dg:r.dg||null,unk:!!r.unk,name:t.name,phone,email,insta,fb,vk,tgc,addr,score:sc,why,temp:sc>=4?"hot":sc>=2?"warm":"cold",tag,niche,kind:KIND[t.shop]||KIND[t.amenity]||(t.craft?"Мастерская":"Бизнес")});
  }
  out.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,"ru"));
  /* Without phones in the data (e.g. a 2GIS key without contacts) nobody reaches "hot" by the absolute rule.
     Then rank inside this search: the top quarter with real signals is hot, the next third warm. */
  if(out.length&&!out.some(l=>l.temp==="hot")){
    const n=out.length,hotN=Math.max(1,Math.round(n*.25)),warmN=Math.round(n*.6);
    out.forEach((l,i)=>{l.temp=l.score<1?"cold":i<hotN?"hot":i<warmN?"warm":"cold";l.rel=true});
  }
  return out;
}

async function initMap(){

function drawMarkers(fit){

}

  const nb=$("#nudgeBtn");if(nb)nb.onclick=openProfile;
  const fs=$("#findSite");if(fs)fs.onclick=async()=>{fs.disabled=true;fs.textContent="Ищу сайт…";await checkSite(l);if(selId===l.id)renderDetail()};
  const ns=$("#notSite");if(ns)ns.onclick=()=>{sites[l.id]={found:false,manual:true,at:Date.now()};store.set("sites",sites);if(stOf(l.id)==="site")setStatus(l.id,"new",true);renderDetail()};
}
function siteBox(l,google){
  const r=sites[l.id];
  if(r&&r.found)return'<div class="sitebox found"><b>Похоже, сайт уже есть:</b> <a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.url.replace(/^https?:\/\//,""))+'</a> <span class="verify">совпало: '+esc((r.why||[]).join(", "))+'</span><button class="btn sm" id="notSite">Это не их сайт</button></div>';
  if(r&&!r.found)return'<div class="sitebox"><span class="verify">'+(r.manual?'Отмечено вручную: сайта нет.':'Сайт не нашёлся ни по домену, ни в поиске.')+' Для надёжности можно <a href="'+esc(google)+'" target="_blank" rel="noopener">проверить в Google</a>.</span><button class="btn sm" id="findSite">Проверить ещё раз</button></div>';
  return'<div class="sitebox"><button class="btn sm dark" id="findSite">Найти сайт</button><span class="verify">Проверю домены по названию и поиск. Или <a href="'+esc(google)+'" target="_blank" rel="noopener">вручную в Google</a>.</span></div>';
}
async function checkSite(l){
  try{
    const r=await fetch("/api/findsite",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:l.name,city:cityLabel,phone:l.phone,addr:l.addr,niche:kkOf(l.tag,l.niche,l.name)})});
    if(r.status===429){toast("Слишком много проверок подряд, подождите минуту");return null}
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    sites[l.id]={found:!!j.found,url:j.url||"",why:j.why||[],at:Date.now()};store.set("sites",sites);
    if(j.found&&["new"].includes(stOf(l.id)))setStatus(l.id,"site",true);
    return j;
  }catch(e){toast("Проверка не удалась. Если вы открыли файл с компьютера, она работает только на сайте bezsaita.netlify.app");return null}
}
let checking=false;
async function checkAll(){
  if(checking){checking=false;return}
  const todo=visible().filter(l=>!sites[l.id]&&stOf(l.id)==="new").slice(0,60);
  if(!todo.length){toast("Все бизнесы в списке уже проверены");return}
  checking=true;const btn=$("#chk"),total=todo.length;let done=0,found=0;
  const upd=()=>{btn.textContent=checking?"Стоп ("+done+"/"+total+")":"Проверить сайты";prog((checking?'<span class="spin"></span>':'')+'Проверка сайтов: '+done+' из '+total+', нашлось с сайтом: '+found+'.')};
  upd();
  const worker=async()=>{while(checking&&todo.length){const l=todo.shift();const j=await checkSite(l);done++;if(j&&j.found)found++;upd();renderStats();renderList()}};
  await Promise.all([worker(),worker(),worker()]);
  checking=false;upd();renderDetail();
}
function setStatus(id,s,quiet){if(s==="new")delete statuses[id];else statuses[id]=s;store.set("statuses",statuses);renderStats();renderList();
  document.querySelectorAll("[data-st]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.st===(statuses[id]||"new"))));if(!quiet)toast("Статус: "+ST[s])}
function copy(t,msg,after){const ok=()=>{toast(msg);after&&after()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t,ok));else fallbackCopy(t,ok)}
function fallbackCopy(t,ok){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){toast("Не удалось скопировать")}ta.remove()}
function toast(t){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2000)}
function select(id,fromMap){selId=id;renderList();drawMarkers(false);renderDetail();
  const l=leads.find(x=>x.id===id);if(map&&l&&l.lat!=null&&!fromMap)map.setView([l.lat,l.lon],Math.max(map.getZoom(),15));
  if(innerWidth<900)$("#detail").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  else{const li=document.querySelector('.lead[data-id="'+CSS.escape(id)+'"]');li&&li.scrollIntoView({block:"nearest"})}}
function renderAll(fit){renderStats();renderList();renderDetail();$(".mapcard").hidden=isDemo||!leads.length;if(map&&!$(".mapcard").hidden)map.invalidateSize();drawMarkers(fit)}
function syncSeg(){document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===filt)))}
function loadDemo(){leads=enrich(DEMO);isDemo=true;cityLabel="";selId=leads[0].id;prog('Это выдуманные компании для примера. Введите свой город, чтобы найти настоящие.');renderAll(false)}

document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{filt=b.dataset.f;syncSeg();showN=200;renderList();drawMarkers(false)});
$("#q").addEventListener("input",()=>{showN=200;renderList();drawMarkers(false)});
$("#stf").addEventListener("change",()=>{renderList();drawMarkers(false)});
$("#list").addEventListener("click",e=>{const li=e.target.closest(".lead");if(li)select(li.dataset.id)});
$("#list").addEventListener("keydown",e=>{const li=e.target.closest(".lead");if(!li)return;
  if(e.key==="Enter"||e.key===" "){e.preventDefault();select(li.dataset.id)}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const n=e.key==="ArrowDown"?li.nextElementSibling:li.previousElementSibling;if(n&&n.dataset.id){select(n.dataset.id);const m=document.querySelector('.lead[data-id="'+CSS.escape(n.dataset.id)+'"]');m&&m.focus()}}});
$("#chk").onclick=()=>{if(isDemo){toast("На примере проверка не работает: это выдуманные компании");return}if(!leads.length){toast("Сначала найдите бизнесы");return}checkAll()};
$("#csv").onclick=()=>{
  if(!leads.length){toast("Сначала найдите бизнесы");return}
  const rows=[["Название","Тип","Адрес","Телефон","Email","Instagram","Часы","Теплота","Статус","OSM"]].concat(leads.map(l=>[l.name,l.kind,l.addr,l.phone,l.email,l.insta,l.tags.opening_hours||"",{hot:"горячий",warm:"тёплый",cold:"холодный"}[l.temp],ST[stOf(l.id)],l.id]));
  const csv="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="bezsaita-"+(cityLabel||"demo")+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

function renderSource(){const el=$("#srcline");if(!el)return;el.innerHTML=prof.k2?'Ищем по 2ГИС. <a href="#" id="srcEdit">Изменить ключ</a>':'Ищем по OpenStreetMap. <a href="#" id="srcEdit">Подключить 2ГИС</a> — точнее для России';const a=$("#srcEdit");a.onclick=ev=>{ev.preventDefault();openProfile();setTimeout(()=>$("#pK").focus(),50)}}
renderSource();
/* boot */
const last=store.get("last",null);const c=store.get("city","");if(c)$("#city").value=c;
if(last&&last.data&&last.data.length){leads=enrich(last.data);cityLabel=last.city;prog(esc(cityLabel)+': '+leads.length+' без сайта (из прошлого поиска).')}
renderAll(true);initMap().then(()=>{renderAll(true)});
}

/* ROUTER */
if(location.hash.startsWith("#s/"))bootSite();else bootTool();
</script>
</body>
</html>
