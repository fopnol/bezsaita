[build]
  publish = "public"
  command = "echo static site, nothing to build"

[images]
  remote_images = ['https://images\.unsplash\.com/.*', 'https://([a-z0-9-]+\.)*2gis\.(com|ru)/.*']

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
